/* ===== GOBI animated login ===== */
@keyframes authIn{0%{opacity:0;transform:translateY(34px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes borderGlow{0%,100%{box-shadow:0 0 22px rgba(255,82,111,.28),0 0 60px rgba(255,82,111,.10)}50%{box-shadow:0 0 38px rgba(255,82,111,.55),0 0 90px rgba(255,82,111,.22)}}
@keyframes shine{0%{left:-70%}60%,100%{left:130%}}
@keyframes orbA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-50px) scale(1.25)}}
@keyframes orbB{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-80px,60px) scale(1.2)}}
@keyframes gridMove{from{background-position:0 0}to{background-position:46px 46px}}
@keyframes itemUp{0%{opacity:0;transform:translateY(16px)}100%{opacity:1;transform:none}}
#auth{position:relative;animation:authIn .75s cubic-bezier(.2,.8,.2,1) both,borderGlow 4s ease-in-out .8s infinite;backdrop-filter:blur(6px)}
#auth>img{animation:logoFloat 3.6s ease-in-out infinite;filter:drop-shadow(0 8px 18px rgba(255,82,111,.45))}
#auth>*:not(img){animation:itemUp .6s ease both}
#auth>h3{animation-delay:.15s}#auth>h2{animation-delay:.22s}#auth>p{animation-delay:.29s}
#auth>input:nth-of-type(1){animation-delay:.34s}#auth>input:nth-of-type(2){animation-delay:.40s}#auth>input:nth-of-type(3){animation-delay:.46s}
#auth>.btn{animation-delay:.54s}#auth>.auth-links{animation-delay:.62s}
#auth .field{transition:transform .25s,box-shadow .25s,border-color .25s}
#auth .field:focus{transform:translateY(-2px) scale(1.012);border-color:#ff526f;box-shadow:0 0 0 3px rgba(255,82,111,.22),0 8px 22px rgba(255,82,111,.18);outline:none}
#auth .btn{position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
#auth .btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out 1.2s infinite}
#auth .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 26px rgba(255,82,111,.45)}
#auth .btn:active{transform:scale(.97)}
#auth .auth-links a{transition:color .2s,letter-spacing .2s}
#auth .auth-links a:hover{color:#fff;letter-spacing:.6px}
.auth-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.auth-bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
.auth-bg i:nth-child(1){width:340px;height:340px;background:#ff2a4d;top:-90px;left:-70px;animation:orbA 11s ease-in-out infinite}
.auth-bg i:nth-child(2){width:300px;height:300px;background:#7a2cff;bottom:-80px;right:-60px;animation:orbB 13s ease-in-out infinite}
.auth-bg i:nth-child(3){width:220px;height:220px;background:#ff7a2a;top:48%;left:58%;animation:orbA 15s ease-in-out infinite reverse;opacity:.35}
.auth-bg b{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:46px 46px;animation:gridMove 7s linear infinite}
#auth{z-index:1}
@media (prefers-reduced-motion:reduce){#auth,#auth *,.auth-bg *{animation:none!important}}

/* ===== GOBI equalizer loader ===== */
@keyframes eqBar{0%,100%{transform:scaleY(.28);opacity:.45}50%{transform:scaleY(1);opacity:1}}
@keyframes loaderFade{from{opacity:0}to{opacity:1}}

  V.resellerUpgradeSettings=async function(){

ad')+'">'+esc(x.status||'UNKNOWN')+'</span></td></tr>'));

  V.resellerAssignments=async function(){
   if(ME?.role!=='ADMIN')return;
   $('ti').textContent='MANAGE RESELLERS';
   $('v').innerHTML='<div class="welcome"><div><div class="eyebrow">ADMIN ONLY · RESELLER MANAGEMENT</div><h2>MANAGE RESELLERS</h2><p>Search a username, review its current reseller assignment, and assign or remove an existing reseller.</p></div></div><div class="panel"><div class="row"><input class="field" id="ra-search" placeholder="Search username"><button class="btn" id="ra-find">SEARCH USER</button></div><div id="ra-results" class="reseller-results"></div></div><div id="ra-selected"></div>';
   let selected=null, resellerOptions=[];
   const search=async()=>{const q=$('ra-search').value.trim();if(q.length<2){toast('Enter at least 2 username characters.');return}const b=$('ra-find');b.disabled=true;try{const data=await api('admin/reseller-assignments?username='+encodeURIComponent(q));resellerOptions=data.resellers||[];$('ra-results').innerHTML=data.users.length?data.users.map(u=>'<button class="reseller-result" data-ra-user="'+esc(u.id)+'"><b>'+esc(u.name||'User')+'</b><span>@'+esc(u.username)+' · '+esc(u.role)+'</span><span>Assigned: '+esc(u.assigned_reseller_username||'None')+'</span></button>').join(''):'<p class="muted">No matching users.</p>';document.querySelectorAll('[data-ra-user]').forEach(el=>el.onclick=()=>{selected=data.users.find(u=>u.id===el.dataset.raUser);renderSelected()})}catch(e){toast(e.message)}finally{b.disabled=false}};
   const renderSelected=()=>{if(!selected){$('ra-selected').innerHTML='';return}const current=resellerOptions.find(r=>r.id===selected.assigned_reseller_uid);$('ra-selected').innerHTML='<div class="panel"><div class="welcome"><div><div class="eyebrow">SELECTED ACCOUNT · '+esc(selected.role)+'</div><h2>'+esc(selected.name||'User')+'</h2><p>@'+esc(selected.username)+' · '+esc(selected.email)+'</p></div></div><p class="muted">Current reseller: '+(current?'@'+esc(current.username):esc(selected.assigned_reseller_username||'None'))+'</p><div class="row"><label class="muted">Assign reseller<select class="field" id="ra-reseller"><option value="">No reseller assigned</option>'+resellerOptions.map(r=>'<option value="'+esc(r.id)+'" '+(r.id===selected.assigned_reseller_uid?'selected':'')+'>@'+esc(r.username)+' · '+esc(r.name||'Reseller')+'</option>').join('')+'</select></label><button class="btn" id="ra-save">SAVE ASSIGNMENT</button></div><p class="muted" id="ra-status" aria-live="polite"></p></div>';$('ra-save').onclick=async()=>{const button=$('ra-save');button.disabled=true;try{const result=await api('admin/reseller-assignments',{user_uid:selected.id,reseller_uid:$('ra-reseller').value});toast(result.resellerUsername?'Assigned @'+result.resellerUsername+' to @'+selected.username:'Removed reseller assignment for @'+selected.username);selected.assigned_reseller_uid=$('ra-reseller').value;selected.assigned_reseller_username=result.resellerUsername||'';$('ra-status').textContent='Assignment saved. '+(result.resellerUsername?'Current reseller: @'+result.resellerUsername:'No reseller assigned.');await search()}catch(e){$('ra-status').textContent=e.message;toast(e.message)}finally{const currentButton=$('ra-save');if(currentButton)currentButton.disabled=false}}};
   $('ra-find').onclick=search;$('ra-search').onkeydown=e=>{if(e.key==='Enter')search()};
  };

 });
